<!DOCTYPE html>
<html>
<head>
    <title>My First Webpage</title>
    <style>
        body { font-family: Arial, sans-serif; margin:0; }
        header { background:#4CAF50; color:white; padding:15px; text-align:center; }
        nav { background:#333; }
        nav a { color:white; padding:14px 16px; display:inline-block; text-decoration:none; }
        nav a:hover { background:#ddd; color:black; }
        section { padding:20px; }
        footer { background:#4CAF50; color:white; text-align:center; padding:10px; position:fixed; bottom:0; width:100%; }
    </style>
</head>
<body>
    <header><h1>Welcome to My Page</h1></header>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>
    <section>
        <h2>About This Page</h2>
        <p>This extended HTML example now includes a navigation bar, styled sections, and a footer.</p>
        <button onclick="alert('Hello! You clicked the button.')">Click Me</button>
    </section>
    <footer>&copy; 2026 My First Webpage</footer>
</body>
</html>
